<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<title>Quick Ask</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
:root{color-scheme:light dark;--ink:#1d1d1f;--muted:#72737d;--glass:rgba(255,255,255,.55);--line:rgba(255,255,255,.3);--control:rgba(255,255,255,.3);--composer:rgba(255,255,255,.55)}
@media(prefers-color-scheme:dark){:root{--ink:#eeeae6;--muted:#aaa39d;--glass:rgba(24,21,20,.42);--line:rgba(255,255,255,.12);--control:rgba(255,255,255,.08);--composer:rgba(29,29,31,.618)}}
button,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0;background:var(--control);display:grid;place-items:center}button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}button:disabled{opacity:.35;cursor:default}button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#panel{height:100%;border:1px solid var(--line);border-radius:999px;background:var(--glass);display:flex;flex-direction:column;overflow:hidden;padding:3px;gap:12px}
#toolbar{display:none;align-items:center;justify-content:space-between;-webkit-app-region:drag}#toolbar button{-webkit-app-region:no-drag;width:28px;height:28px;border-radius:50%}#brand{font-size:11px;color:var(--muted)}
#conversation{display:none;flex:1;min-height:0;overflow:auto;padding:0 8px 8px;scrollbar-width:thin;user-select:text}#q{max-width:85%;margin:0 0 18px auto;padding:9px 13px;background:var(--control);border-radius:20px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}#answer{font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}#status{display:none;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:12px}#orb{width:20px;height:20px}#err{color:var(--ink);font-size:13px;line-height:1.5;margin-top:12px}#err:empty{display:none}#openApp{display:none;width:auto;padding:8px 12px;border-radius:20px;margin-top:12px}
/* A true pill: the 36px send control has only 6px of outer clearance. */
#composer{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;min-height:40px;flex-shrink:0;padding:0 2px 0 14px;border:0;border-radius:999px;background:transparent}
#ask{display:block;resize:none;width:100%;height:40px;min-height:40px;max-height:110px;margin:0;padding:9px 0;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;line-height:22px;user-select:text}#ask::placeholder{color:var(--muted)}#composerBar{display:contents}#hint{display:none}#send{width:46px;height:36px;margin-left:12px;border-radius:999px;background:var(--ink);color:Canvas}#send svg{width:24px;height:24px;transform:rotate(-90deg)}#send svg path{stroke-width:7;stroke-linecap:round}
.expanded #toolbar{display:flex}.expanded #conversation{display:block}.expanded #composer{background:var(--composer);backdrop-filter:blur(50px)}.expanded #panel{padding:12px;border-radius:24px}.busy #status{display:flex}
</style>
</head>
<body>
<main id="panel">
<header id="toolbar"><button id="close" aria-label="Dismiss"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button><span id="brand">HeySurf</span><button id="expand" aria-label="Open in HeySurf"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg></button></header>
<section id="conversation" aria-label="Quick Ask conversation"><div id="q"></div><div id="answer"></div><div id="status" role="status"><canvas id="orb" aria-hidden="true"></canvas><span>Pondering</span></div><div id="err" role="alert"></div><button id="openApp">Continue in HeySurf</button></section>
<form id="composer"><textarea id="ask" aria-label="Ask HeySurf" placeholder="Ask anything…" maxlength="4000" rows="1" autofocus></textarea><div id="composerBar"><span id="hint">HeySurf <span aria-hidden="true">·</span> ⌥ Space</span><button id="send" type="submit" aria-label="Send question"><svg viewBox="0 0 60 44" fill="none" aria-hidden="true"><path d="M5 22h47M34 4c0 10 8 18 18 18-10 0-18 8-18 18" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg></button></div></form>
</main>
<script type="module" src="./quickask.mjs"></script>
</body>
</html>
